# Ownership configuration for WarmPath monorepo
# Used by scripts/check_scope.py to prevent merge collisions

roles:
  m1:
    allowed_prefixes:
      - backend/app/core/
      - backend/app/modules/auth/
      - backend/app/modules/trust/
      - app/lib/core/
      - app/lib/features/auth/
      - app/lib/features/safety/
      - admin/src/core/
      - admin/src/pages/moderation/
      - admin/src/pages/verification/
      - contracts/modules/auth.yaml
      - contracts/modules/trust.yaml
      - scripts/
      - .github/
      - docs/
      - data/
      - PROJECT_CONTEXT.md
      - CONTRIBUTING.md
      - OWNERS.md
      - README.md
      - LICENSE
      - .gitignore
      - .gitattributes
      - .editorconfig
      - .pre-commit-config.yaml
      - .env.example
      - docker-compose.yml
      - backend/Dockerfile
      - backend/pyproject.toml
      - backend/alembic.ini
      - backend/alembic/
      - backend/tests/
      - app/pubspec.yaml
      - app/pubspec.lock
      - app/lib/main.dart
      - app/lib/app_router.dart
      - app/test/
      - admin/package.json
      - admin/tsconfig.json
      - admin/vite.config.ts
      - admin/tailwind.config.js
      - admin/postcss.config.js
      - admin/index.html
      - admin/src/main.tsx
      - admin/src/App.tsx

  m2:
    allowed_prefixes:
      - backend/app/modules/resume/
      - backend/app/modules/matching/
      - app/lib/features/onboarding/
      - app/lib/features/discover/
      - contracts/modules/resume.yaml
      - contracts/modules/matching.yaml
      - scripts/perf/
      - docs/PERFORMANCE.md

  m3:
    allowed_prefixes:
      - backend/app/modules/availability/
      - backend/app/modules/sessions/
      - backend/app/modules/ratings/
      - app/lib/features/availability/
      - app/lib/features/sessions/
      - app/lib/features/ratings/
      - contracts/modules/availability.yaml
      - contracts/modules/sessions.yaml
      - contracts/modules/ratings.yaml

  m4:
    allowed_prefixes:
      - backend/app/modules/credits/
      - backend/app/modules/payments/
      - backend/app/modules/institution/
      - app/lib/features/plans_wallet/
      - admin/src/pages/dashboard/
      - admin/src/pages/seats/
      - contracts/modules/credits.yaml
      - contracts/modules/payments.yaml
      - contracts/modules/institution.yaml
