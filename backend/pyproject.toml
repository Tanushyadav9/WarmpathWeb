[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "warmpath-backend"
version = "0.1.0"
description = "WarmPath Modular Monolith API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pgvector>=0.3.1",
    "redis>=5.0.4",
    "httpx>=0.27.0",
    "aiosmtplib>=3.0.1",
    "firebase-admin>=6.5.0",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "razorpay>=1.4.1",
    "google-genai>=0.1.1",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "websockets>=12.0",
    "arq>=0.25.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "schemathesis>=3.27.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "locust>=2.28.0",
    "pre-commit>=3.7.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app/modules"]
pythonpath = ["."]
addopts = "--import-mode=importlib"


[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
